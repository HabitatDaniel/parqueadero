<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Buscar Vehículo por Placa</title>
    <link rel="icon" type="image/x-icon" href="../../../assets/img/IconoPrincipal.png">
    <link rel="stylesheet" href="../../../assets/css/styles-bootstrap5Busqueda.css ">
    <link rel="stylesheet" href="../../../assets/css/bootstrap.css">
</head>

<body>
    <div class="row col-12 col-sm-12 col-md-6 col-lg-12  contenedor">
        <div class="col-12 col-sm-12 col-md-22 col-lg-10 logo ">

            <img src="../../../assets/img/portafolio-1.png" class="img-fluid border" alt="Imagen Portafolio" />
        </div>
        <div class="col-12 col-sm-12 col-md-22 col-lg-10 titulo">

            <h2>Buscar Información del Vehículo</h2>
        </div>
        <!-- El formulario envía el dato al archivo del servidor (ej. buscar.php) -->
        <form action="../../../assets/php/Busqueda/BuscarVehiculo.php" class="col-12 col-sm-12 col-md-22 col-lg-10" method="GET">
            <div class="subtitulo">
                <label for="placa">
                    Ingrese la Placa del Vehículo:
                </label>
            </div>
            <input type="text" id="placa" class="placa" name="placa" style="text-transform: uppercase;"
                placeholder="Ej: ABC123" required autofocus autocomplete="off">
            <div class="col-12 col-sm-12 col-md-22 col-lg-8 header">

                <button type="submit" class="boton">BUSCAR</button>

            </div>

        </form>
    </div>


</body>

</html>
