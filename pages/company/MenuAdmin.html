    <script>
        // Control del Menú Lateral Sidenav
        function openNav() {
            document.getElementById("mySidenav").style.width = "250px";
        }

        /* Cambiado de void a 0 por sintaxis estricta */
        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
        }

        function cerrarSesion() {
            sessionStorage.clear(); // Limpia almacenamiento local
            window.location.replace("logout.php");
        }

        // Historial de navegación (Evitar botón atrás)
        window.history.pushState(null, null, window.location.href);
        window.onpopstate = function () {
            window.history.go(1);
        };

        // Cargar páginas dinámicamente con fetch
  function cargarPagina(url) {
    fetch(url)
        .then(response => {
            if (!response.ok) {
                throw new Error('Error al cargar el archivo');
            }
            return response.text();
        })
        .then(data => {
            const contenedor = document.getElementById('contenedor-principal');
            
            // 1. Insertamos el HTML de la página
            contenedor.innerHTML = data;

            // 2. Buscamos y cargamos los estilos CSS dinámicamente
            // Creamos un contenedor temporal en memoria para analizar el HTML
            const parser = new DOMParser();
            const doc = parser.parseFromString(data, 'text/html');
            const enlacesCss = doc.querySelectorAll('link[rel="stylesheet"]');

            // Inyectamos cada CSS en el <head> de la página principal si no existe ya
            enlacesCss.forEach(cssOriginal => {
                const href = cssOriginal.getAttribute('href');
                
                // Evitamos duplicar el CSS si ya se había cargado antes
                if (!document.querySelector(`link[href="${href}"]`)) {
                    const nuevoLink = document.createElement('link');
                    nuevoLink.rel = 'stylesheet';
                    nuevoLink.href = href;
                    document.head.appendChild(nuevoLink);
                }
            });
        })
        .catch(error => {
            console.error('Hubo un problema:', error);
            document.getElementById('contenedor-principal').innerHTML = '<p style="color:red;">Error al cargar la página o archivo no encontrado.</p>';
        });
}


        function imprimirContenedor() {
            const elemento = document.getElementById('contenedor-principal');

            // Validación por si el contenedor está vacío
            if (!elemento || elemento.innerText.trim() === "FRAME PRINCIPAL") {
                alert("Por favor, carga primero una opción (Inicio, Servicios, etc.) antes de imprimir.");
                return;
            }

            // Abre el asistente de impresión del navegador
            // Desde allí el usuario puede elegir "Guardar como PDF" o seleccionar su impresora
            window.print();
        }

    </script>
