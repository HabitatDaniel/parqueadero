    <script>
        function mostrarOcultar(boton) {
            var pass1 = document.getElementById("miPassword1");
            var pass2 = document.getElementById("miPassword2");
            var texto = document.getElementById("textoBoton");
            var emoji = document.getElementById("iconoEmoji");

            if (pass1.type === "password") {
                pass1.type = "text";
                pass2.type = "text";
                texto.textContent = "Ocultar";
                emoji.textContent = "🙈";
                boton.classList.replace("btn-warning", "btn-danger");
            } else {
                pass1.type = "password";
                pass2.type = "password";
                texto.textContent = "Mostrar";
                emoji.textContent = "👁️";
                boton.classList.replace("btn-danger", "btn-warning");
            }
        }
    </script>

    <script>
        function verificarIgualdad() {
            var input1 = document.getElementById("miPassword1").value;
            var input2 = document.getElementById("miPassword2").value;

            // Validar que no envíen campos vacíos
            if(input1.trim() === "" || input2.trim() === "") {
                alert("Por favor, completa ambos campos.");
                return;
            }

            if (input1 === input2) {
                // 1. Obtener la cédula (ccEmpleado) que viene en la URL actual de esta página
                var parametrosUrl = new URLSearchParams(window.location.search);
                var cedula = parametrosUrl.get("ccEmpleado") || ""; 

                // 2. Codificar los datos para viajar seguros por URL
                var datoClave = encodeURIComponent(input1);
                var datoCedula = encodeURIComponent(cedula);
                // 3. Enviar AMBOS datos en la URL usando el conector '&'
                window.location.href = "../../assets/php/Empleado/guardarClave.php?dato=" + datoClave + "&ccEmpleado=" + datoCedula;
            } else {
                alert("Los valores no son iguales. Inténtalo de nuevo.");
            }
        }
    </script>

    <script type="text/javascript">
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };
    </script>
