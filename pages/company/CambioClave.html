    <script>
        function mostrarOcultar(boton) {
            // Seleccionamos ambos inputs usando sus nuevos IDs únicos
            var pass1 = document.getElementById("miPassword1");
            var pass2 = document.getElementById("miPassword2");

            var texto = document.getElementById("textoBoton");
            var emoji = document.getElementById("iconoEmoji");

            // Evaluamos el estado del primero (ambos cambian juntos)
            if (pass1.type === "password") {
                pass1.type = "text";
                pass2.type = "text";

                texto.textContent = "Ocultar";
                emoji.textContent = "🙈";
                boton.classList.replace("btn-warning", "btn-danger");
            } else {
                pass1.type = "password";
                pass2.type = "password";

                texto.textContent = "Mostrar";
                emoji.textContent = "👁️";
                boton.classList.replace("btn-danger", "btn-warning");
            }
        }

    </script>
    <script>
        function verificarIgualdad() {
            // Obtener los valores de los inputs
            var input1 = document.getElementById("miPassword1").value;
            var input2 = document.getElementById("miPassword2").value;

            // Comparar si son iguales
            if (input1 === input2) {
                 var datoAEnviar = encodeURIComponent(input1);
            
                // Enviar a otro archivo si son iguales
                window.location.href = "../../assets/php/Empleado/guardarClave.php?dato=" + datoAEnviar;
            } else {
                // Mensaje si no son iguales
                alert("Los valores no son iguales. Inténtalo de nuevo.");
            }
        }
    </script>
    <script type="text/javascript">
        // Al cargar la página, forzamos un nuevo estado en el historial

            history.go(1);
